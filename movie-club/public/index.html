<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Club Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎬 Movie Club Manager</h1>
    <p>Add, search, update and delete the club's movie collection</p>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle">Add a New Movie</h2>
      <form id="movieForm">
        <input type="hidden" id="movieId" />
        <div class="grid">
          <label>Title
            <input type="text" id="title" required />
          </label>
          <label>Genre
            <input type="text" id="genre" required placeholder="e.g. Drama, Sci-Fi" />
          </label>
          <label>Release Year
            <input type="number" id="releaseYear" required min="1888" max="2100" />
          </label>
          <label>Rating (0 - 10)
            <input type="number" id="rating" required min="0" max="10" step="0.1" />
          </label>
          <label>Director
            <input type="text" id="director" required />
          </label>
        </div>
        <div class="actions">
          <button type="submit" id="submitBtn">Add Movie</button>
          <button type="button" id="cancelBtn" class="secondary" hidden>Cancel Edit</button>
        </div>
        <p id="message" role="status"></p>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>All Movies <span id="count"></span></h2>
        <input type="search" id="search" placeholder="Search by title or genre..." />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Title</th><th>Genre</th><th>Year</th><th>Rating</th><th>Director</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="movieBody"></tbody>
        </table>
      </div>
      <p id="empty" hidden>No movies found.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
